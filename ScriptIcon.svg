<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" version="1.1" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a0a0a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#2d2d30" opacity="0.9"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#metalGradient)" stroke-width="6"/>

  <!-- Inner ring -->
  <circle cx="32" cy="32" r="12" fill="none" stroke="url(#metalGradient)" stroke-width="4"/>

  <!-- Balls (8 positioned around the bearing) -->
  <circle cx="32" cy="14" r="2.5" fill="#4CAF50"/>
  <circle cx="44.85" cy="17.15" r="2.5" fill="#4CAF50"/>
  <circle cx="50" cy="32" r="2.5" fill="#4CAF50"/>
  <circle cx="44.85" cy="46.85" r="2.5" fill="#4CAF50"/>
  <circle cx="32" cy="50" r="2.5" fill="#4CAF50"/>
  <circle cx="19.15" cy="46.85" r="2.5" fill="#4CAF50"/>
  <circle cx="14" cy="32" r="2.5" fill="#4CAF50"/>
  <circle cx="19.15" cy="17.15" r="2.5" fill="#4CAF50"/>

  <!-- Center hole highlight -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#404040" stroke-width="1" opacity="0.5"/>

  <!-- Rotation indicator lines -->
  <path d="M 32,8 L 32,4" stroke="#00A8E8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 32,60 L 32,56" stroke="#00A8E8" stroke-width="2" stroke-linecap="round"/>
</svg>
